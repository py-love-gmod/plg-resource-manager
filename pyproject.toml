[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylovegmod-resource-manager"
version = "0.0.1.post3"
description = "Resource pipeline for GMod addons: textures, sounds, models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Cain" }]
dependencies = ["colorama", "pylovegmod-shared", "Pillow"]

[project.scripts]
plg-resource-manager = "plg_resource_manager.__main__:main"

[project.urls]
homepage = "https://github.com/py-love-gmod/plg-resource-manager"

[tool.setuptools]
packages = { find = { where = ["."] } }

[[tool.setuptools.ext-modules]]
name = "plg_resource_manager.dxt._compressor"
sources = ["plg_resource_manager/dxt/_compressor.c"]

[[tool.setuptools.ext-modules]]
name = "plg_resource_manager.vtf._vtf"
sources = ["plg_resource_manager/vtf/_vtf.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
