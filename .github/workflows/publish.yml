name: Build and publish wheels

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22

      - name: Verify wheels integrity
        shell: bash
        run: |
          for f in wheelhouse/*.whl; do
            echo "Checking $f"
            unzip -t "$f" || (echo "Corrupt wheel: $f" && exit 1)
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wheels-*

      - name: Collect wheels into single directory
        run: |
          mkdir wheelhouse
          find artifacts -name "*.whl" -exec cp {} wheelhouse/ \;

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
